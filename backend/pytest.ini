[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    smoke: Quick sanity checks that the app is alive
    auth: Authentication and authorization tests
    admin: Admin-only endpoint tests
    students: Student API tests
    certificates: Certificate issuance and verification tests
    payments: Razorpay payment flow tests
    referrals: Referral system tests
    portfolio: Portfolio endpoint tests
    webhooks: GitHub webhook handler tests
    regression: Critical regression tests that must always pass
    edge: Edge cases, boundary and negative tests
addopts = -v --tb=short

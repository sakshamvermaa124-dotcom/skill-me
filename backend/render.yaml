services:
  - type: web
    name: skillme-api
    env: python
    region: singapore  # Closest to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # ── Database (Turso) ──────────────────────────────────────────
      - key: TURSO_DB_URL
        sync: false   # Set this in Render Dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false   # Set this in Render Dashboard
      # ── GitHub ───────────────────────────────────────────────────
      - key: SKILLME_GITHUB_TOKEN
        sync: false   # Set this in Render Dashboard
      - key: GITHUB_ORG
        value: sakshamvermaa124-dotcom
      - key: WEBHOOK_SECRET
        sync: false   # Set this in Render Dashboard
      # ── Admin ────────────────────────────────────────────────────
      - key: ADMIN_API_KEY
        sync: false   # Set this in Render Dashboard
      # ── Email (Brevo SMTP) ────────────────────────────────────────
      - key: EMAIL_ENABLED
        value: "True"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false   # Set this in Render Dashboard
      - key: SMTP_PASSWORD
        sync: false   # Set this in Render Dashboard (Brevo SMTP key)
      - key: SMTP_FROM_NAME
        value: SkillMe Team
      - key: SMTP_FROM_EMAIL
        sync: false   # Set this in Render Dashboard (must be verified in Brevo)
      - key: FRONTEND_URL
        value: https://skillme.in
      # ── CORS ─────────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        value: "https://skillme.in,https://www.skillme.in"
      # ── Payments (Razorpay) ───────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false   # Set this in Render Dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false   # Set this in Render Dashboard
      - key: CERTIFICATE_PRICE_PAISE
        value: "24900"

services:
  - type: web
    name: skillme-api
    env: python
    region: singapore  # Closest to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TURSO_DB_URL
        sync: false   # Set this manually in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false   # Set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.4

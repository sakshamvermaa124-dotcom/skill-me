  <style>
    /* Tokens mirror style.css "EMBER" — obsidian surfaces, champagne gold, sage green */
    :root {
      --bg: #0c0b0b;
      --surface: #141313;
      --card: #181717;
      --card-hover: #1f1e1e;
      --line: rgba(235, 230, 224, 0.07);
      --line-strong: rgba(235, 230, 224, 0.12);
      --gold: #c99a4e;
      --gold-soft: #d8ac63;
      --gold-dim: rgba(201, 154, 78, 0.10);
      --gold-line: rgba(201, 154, 78, 0.28);
      --sage: #4fa36b;
      --sage-soft: #6cc08a;
      --sage-dim: rgba(79, 163, 107, 0.12);
      --text: #eae6e1;
      --text-2: #a39c94;
      --text-3: #7a736c;
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 12px 32px -12px rgba(0, 0, 0, 0.6);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 45% at 50% -8%, rgba(201, 154, 78, 0.07), transparent 70%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

    /* ─── Navigation ─── */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(12, 11, 11, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
    }
    .nav-container {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .nav-logo-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      object-fit: cover;
    }
    .nav-brand-text {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .nav-brand-text span { color: var(--gold); }
    .nav-divider {
      width: 1px;
      height: 18px;
      background: var(--line-strong);
      margin: 0 4px;
    }
    .nav-context {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-2);
    }
    .nav-actions { display: flex; align-items: center; gap: 10px; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.86rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease), color 0.2s var(--ease);
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(135deg, #c99a4e 0%, #b5873d 100%);
      color: #0c0b0b;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #d8ac63 0%, #c99a4e 100%); }
    .btn-ghost {
      background: rgba(235, 230, 224, 0.04);
      border-color: var(--line-strong);
      color: var(--text);
    }
    .btn-ghost:hover { background: rgba(235, 230, 224, 0.08); border-color: rgba(235, 230, 224, 0.2); }
    .btn-sm { padding: 8px 14px; font-size: 0.8rem; }

    /* ─── Layout ─── */
    .portfolio-wrapper {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 72px;
      width: 100%;
      flex: 1;
    }
    .fade-in { animation: fadeUp 0.5s var(--ease) both; }
    .fade-in:nth-child(2) { animation-delay: 0.06s; }
    .fade-in:nth-child(3) { animation-delay: 0.12s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    /* ─── Hero ─── */
    .profile-hero-card {
      position: relative;
      overflow: hidden;
      padding: 36px;
      margin-bottom: 20px;
      border-color: var(--gold-line);
    }
    .profile-hero-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.8;
    }
    .profile-hero-card::after {
      content: '';
      position: absolute;
      width: 420px;
      height: 420px;
      right: -160px;
      top: -220px;
      background: radial-gradient(circle, rgba(201, 154, 78, 0.10), transparent 65%);
      pointer-events: none;
    }
    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 32px;
      align-items: center;
    }
    .hero-identity {
      display: flex;
      align-items: center;
      gap: 24px;
      min-width: 0;
    }
    .avatar-monogram {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 2.1rem;
      letter-spacing: -0.03em;
      color: var(--gold-soft);
      background: radial-gradient(circle at 30% 25%, #262320, #141313 70%);
      border: 1.5px solid var(--gold);
      box-shadow: 0 0 0 6px var(--gold-dim);
      position: relative;
    }
    .avatar-verified {
      position: absolute;
      right: -2px;
      bottom: 2px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--sage);
      border: 3px solid var(--card);
      display: grid;
      place-items: center;
      color: #0c0b0b;
    }
    .hero-meta { min-width: 0; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-soft);
      margin-bottom: 8px;
    }
    .eyebrow .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sage);
      box-shadow: 0 0 0 0 rgba(79, 163, 107, 0.6);
      animation: pulse 2.4s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(79, 163, 107, 0.55); }
      70% { box-shadow: 0 0 0 8px rgba(79, 163, 107, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 163, 107, 0); }
    }
    .hero-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.9rem, 4.2vw, 2.7rem);
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .hero-role {
      margin-top: 8px;
      font-size: 1rem;
      color: var(--text-2);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }
    .hero-role strong { color: var(--text); font-weight: 600; }
    .hero-role .sep { color: var(--text-3); }
    .domain-row {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .domain-tag {
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      color: var(--gold-soft);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* Progress seal */
    .hero-seal {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 22px;
      border-radius: var(--radius-md);
      background: rgba(12, 11, 11, 0.5);
      border: 1px solid var(--line);
      min-width: 168px;
    }
    .seal-ring { position: relative; width: 104px; height: 104px; }
    .seal-ring svg { transform: rotate(-90deg); }
    .seal-ring .track { stroke: rgba(235, 230, 224, 0.08); }
    .seal-ring .bar {
      stroke: var(--gold);
      stroke-linecap: round;
      transition: stroke-dashoffset 1.1s var(--ease);
    }
    .seal-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .seal-value {
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .seal-value span { font-size: 0.95rem; color: var(--text-3); font-weight: 700; }
    .seal-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-2);
    }

    .hero-footer {
      position: relative;
      z-index: 1;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .hero-issued {
      font-size: 0.8rem;
      color: var(--text-3);
    }
    .hero-issued strong { color: var(--text-2); font-weight: 600; }
    .owner-tip {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--gold-dim);
      border: 1px dashed var(--gold-line);
      font-size: 0.8rem;
      color: var(--text-2);
    }
    .owner-tip strong { color: var(--gold-soft); }

    /* ─── Stats ─── */
    .stats-bento-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      padding: 20px;
      border-radius: var(--radius-md);
      transition: border-color 0.25s var(--ease), transform 0.25s var(--ease);
    }
    .stat-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
    .stat-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--gold-dim);
      color: var(--gold);
      margin-bottom: 16px;
    }
    .stat-icon.sage { background: var(--sage-dim); color: var(--sage-soft); }
    .stat-value {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-value small { font-size: 0.95rem; font-weight: 700; color: var(--text-3); margin-left: 2px; }
    .stat-label {
      margin-top: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-2);
    }

    /* ─── Content grid ─── */
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 20px;
      align-items: start;
    }
    .panel { padding: 26px; }
    .panel + .panel { margin-top: 20px; }
    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .panel-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .panel-sub { font-size: 0.8rem; color: var(--text-3); }

    /* Milestone timeline */
    .timeline { list-style: none; position: relative; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 17px;
      top: 18px;
      bottom: 18px;
      width: 1px;
      background: linear-gradient(to bottom, var(--gold-line), var(--line));
    }
    .timeline li + li { margin-top: 12px; }
    .milestone {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
    }
    .milestone-node {
      position: relative;
      z-index: 1;
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--card);
      border: 1.5px solid var(--gold);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gold-soft);
    }
    .milestone-body {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--line);
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    a.milestone:hover .milestone-body { background: var(--card-hover); border-color: var(--gold-line); }
    a.milestone:hover .milestone-cta { color: var(--gold-soft); }
    a.milestone:hover .milestone-cta svg { transform: translate(2px, -2px); }
    .milestone-title {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--text);
    }
    .milestone-meta {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      font-size: 0.78rem;
      color: var(--text-3);
    }
    .badge-approved {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--sage-dim);
      color: var(--sage-soft);
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .milestone-domain { color: var(--gold-soft); font-weight: 600; }
    .milestone-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-2);
      transition: color 0.2s var(--ease);
    }
    .milestone-cta svg { transition: transform 0.2s var(--ease); }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-md);
      color: var(--text-2);
      font-size: 0.88rem;
    }
    .empty-state strong { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }

    /* Skills */
    .skills-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-pill {
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(235, 230, 224, 0.04);
      border: 1px solid var(--line-strong);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Verification */
    .recruiter-trust-box { border-color: rgba(79, 163, 107, 0.22); }
    .trust-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--sage-dim);
      color: var(--sage-soft);
      margin-bottom: 14px;
    }
    .trust-desc {
      font-size: 0.85rem;
      color: var(--text-2);
      line-height: 1.65;
      margin: 8px 0 18px;
    }
    .trust-list { list-style: none; margin-bottom: 20px; }
    .trust-list li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 0.82rem;
      color: var(--text-2);
    }
    .trust-list li + li { margin-top: 8px; }
    .trust-list svg { flex-shrink: 0; margin-top: 3px; color: var(--sage-soft); }

    .page-footer {
      margin-top: 48px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-3);
    }
    .page-footer a { color: var(--text-2); text-decoration: none; }
    .page-footer a:hover { color: var(--gold-soft); }

    /* ─── Toast ─── */
    .portfolio-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      background: #1f1e1e;
      border: 1px solid var(--gold-line);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.7);
      transform: translate(-50%, 120px);
      opacity: 0;
      transition: transform 0.35s var(--ease), opacity 0.35s var(--ease);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .portfolio-toast.show { transform: translate(-50%, 0); opacity: 1; }

    /* ─── Loading skeleton ─── */
    .skeleton {
      background: linear-gradient(90deg, rgba(235,230,224,0.04) 25%, rgba(235,230,224,0.08) 50%, rgba(235,230,224,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-lg);
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ─── Locked / Error States ─── */
    .locked-card {
      padding: 56px 28px;
      text-align: center;
      max-width: 560px;
      margin: 48px auto;
    }
    .locked-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      color: var(--gold);
      display: grid;
      place-items: center;

  <!-- Theme bootstrap — before first paint. Same key as the main site + dashboard. -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('skillme-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <style>
    /* ═══ Tokens ═══════════════════════════════════════════════
       SkillMe brand: white/black/grey canvas, red actions, orange highlights.
       ("gold" token names are kept for the highlight role so component rules stay unchanged.) */
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #09090a;
      --surface: #111113;
      --card: #121214;
      --card-2: #18181b;
      --card-hover: #1f1f23;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.15);
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #71717a;
      --gold: #ff7a2f;
      --gold-soft: #ff8f4f;
      --gold-ink: #ffffff;
      --gold-text: #ff8f4f;
      --gold-dim: rgba(255, 122, 47, 0.12);
      --gold-line: rgba(255, 122, 47, 0.36);
      --cta: #ef3e36;
      --cta-hover: #ff5148;
      --cta-ink: #ffffff;
      --sage: #22c55e;
      --sage-text: #4ade80;
      --sage-dim: rgba(74, 222, 128, 0.12);
      --sage-line: rgba(74, 222, 128, 0.30);
      --aurora-1: rgba(255, 122, 47, 0.22);
      --aurora-2: rgba(239, 62, 54, 0.16);
      --aurora-3: rgba(255, 255, 255, 0.05);
      --grid-line: rgba(255, 255, 255, 0.04);
      --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 18px 44px -18px rgba(0, 0, 0, 0.75);
      --shadow-lg: 0 40px 90px -30px rgba(0, 0, 0, 0.85);
      --nav-bg: rgba(9, 9, 10, 0.75);
      --cred-bg: linear-gradient(150deg, #1c1c1f 0%, #111113 55%, #19140f 100%);
      --sheen: rgba(255, 170, 120, 0.18);
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #ffffff;
      --card: #ffffff;
      --card-2: #f6f6f7;
      --card-hover: #efeff1;
      --line: #e7e7ea;
      --line-strong: #d4d4d8;
      --text: #0a0a0a;
      --text-2: #52525b;
      --text-3: #8b8b94;
      --gold: #f26a1b;
      --gold-soft: #e05d12;
      --gold-ink: #ffffff;
      --gold-text: #c2500d;
      --gold-dim: rgba(242, 106, 27, 0.09);
      --gold-line: rgba(242, 106, 27, 0.32);
      --cta: #e5322d;
      --cta-hover: #c92420;
      --cta-ink: #ffffff;
      --sage: #16a34a;
      --sage-text: #15803d;
      --sage-dim: rgba(21, 128, 61, 0.09);
      --sage-line: rgba(21, 128, 61, 0.28);
      --aurora-1: rgba(242, 106, 27, 0.16);
      --aurora-2: rgba(229, 50, 45, 0.10);
      --aurora-3: rgba(10, 10, 10, 0.04);
      --grid-line: rgba(10, 10, 10, 0.05);
      --shadow: 0 1px 2px rgba(10, 10, 10, 0.04), 0 16px 40px -20px rgba(10, 10, 10, 0.18);
      --shadow-lg: 0 40px 80px -30px rgba(10, 10, 10, 0.28);
      --nav-bg: rgba(255, 255, 255, 0.82);
      --cred-bg: linear-gradient(150deg, #ffffff 0%, #fafafa 60%, #fff6ef 100%);
      --sheen: rgba(255, 170, 120, 0.22);
    }
    :root {
      --font-display: 'Geist', ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Geist', ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --wrap: 1120px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--cta); outline-offset: 3px; border-radius: 8px; }
    ::selection { background: var(--gold-dim); }
    html.theme-switching *, html.theme-switching *::before, html.theme-switching *::after {
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease !important;
    }
    [data-theme="dark"] .ti-moon, [data-theme="light"] .ti-sun { display: none; }

    .highlight-value, .seal-value, .milestone-num, .cred-row dd.mono { font-family: var(--font-mono); letter-spacing: -0.04em; }
    .highlight-value small, .seal-value span { font-family: var(--font-body); letter-spacing: 0; }
    .section-kicker, .milestone-week, .cred-type, .cred-row dt { font-family: var(--font-mono); font-weight: 500; }

    /* ═══ Navigation ═══ */
    .navbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--nav-bg);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border-bottom: 1px solid var(--line);
    }
    .nav-container {
      max-width: var(--wrap); margin: 0 auto;
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .nav-logo-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .nav-brand-text { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
    .nav-brand-text span { color: var(--gold); }
    .nav-divider { width: 1px; height: 18px; background: var(--line-strong); margin: 0 4px; }
    .nav-context { font-size: 0.8rem; font-weight: 600; color: var(--text-2); }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 38px; height: 38px;
      display: inline-grid; place-items: center;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--card);
      color: var(--text-2);
      cursor: pointer;
      transition: color 0.2s, background 0.2s, transform 0.2s var(--ease);
    }
    .icon-btn:hover { color: var(--text); background: var(--card-hover); }
    .icon-btn:active { transform: scale(0.94); }

    /* ═══ Buttons ═══ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 18px;
      border-radius: 12px;
      font-family: var(--font-body); font-size: 0.88rem; font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease), color 0.2s;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(0.98); }
    .btn-primary {
      background: var(--cta);
      color: var(--cta-ink);
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 10px 24px -12px rgba(229,50,45,0.8);
    }
    .btn-primary:hover { background: var(--cta-hover); }
    .btn-linkedin { background: #0a66c2; color: #fff; box-shadow: 0 10px 24px -12px rgba(10,102,194,0.9); }
    .btn-linkedin:hover { background: #0b74dc; }
    .btn-ghost { background: var(--card); border-color: var(--line-strong); color: var(--text); }
    .btn-ghost:hover { background: var(--card-hover); border-color: var(--gold-line); }
    .btn-sm { padding: 8px 14px; font-size: 0.8rem; border-radius: 10px; }

    /* ═══ Layout ═══ */
    .portfolio-wrapper { width: 100%; flex: 1; }
    .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
    .reveal.in { opacity: 1; transform: none; }
    .section { padding: 56px 0 0; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .section-kicker {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--gold-text);
      margin-bottom: 6px;
    }
    .section-title { font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
    .section-sub { font-size: 0.9rem; color: var(--text-2); max-width: 460px; }

    /* ═══ Hero ═══ */
    .profile-hero-card { position: relative; isolation: isolate; overflow: hidden; padding: 72px 0 64px; }
    .aurora { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
    .aurora::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 30%, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 30%, #000 30%, transparent 75%);
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
    .blob-1 { width: 560px; height: 560px; left: -140px; top: -240px; background: var(--aurora-1); animation: drift1 18s ease-in-out infinite alternate; }
    .blob-2 { width: 460px; height: 460px; right: -120px; top: -120px; background: var(--aurora-2); animation: drift2 22s ease-in-out infinite alternate; }
    .blob-3 { width: 380px; height: 380px; left: 40%; bottom: -260px; background: var(--aurora-3); animation: drift3 26s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 60px) scale(1.1); } }
    @keyframes drift2 { to { transform: translate(-90px, 80px) scale(0.92); } }
    @keyframes drift3 { to { transform: translate(-120px, -40px) scale(1.15); } }

    .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 48px; align-items: center; }
    .hero-identity { min-width: 0; }

    .avatar {
      position: relative;
      width: 104px; height: 104px;
      margin-bottom: 22px;
    }
    .avatar-ring { position: absolute; inset: 0; transform: rotate(-90deg); }
    .avatar-ring .track { stroke: var(--line-strong); }
    .avatar-ring .bar { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 1.6s var(--ease) 0.2s; }
    .avatar-monogram {
      position: absolute; inset: 9px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-family: var(--font-display); font-weight: 800; font-size: 2rem; letter-spacing: -0.03em;
      color: var(--gold-text);
      background: radial-gradient(circle at 30% 25%, var(--card-2), var(--card) 70%);
      border: 1px solid var(--gold-line);
    }
    .avatar-verified {
      position: absolute; right: 2px; bottom: 4px;
      width: 30px; height: 30px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: var(--sage);
      border: 3px solid var(--bg);
      color: #fff;
    }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px 6px 10px;
      border-radius: 999px;
      background: var(--sage-dim);
      border: 1px solid var(--sage-line);
      font-size: 0.76rem; font-weight: 700;
      color: var(--sage-text);
      margin-bottom: 16px;
    }
    .eyebrow .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); animation: pulse 2.4s infinite; }
    .eyebrow .muted { color: var(--text-2); font-weight: 500; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--sage-line); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

    .hero-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.5rem, 6vw, 4.4rem);
      letter-spacing: -0.045em;
      line-height: 1;
      overflow-wrap: anywhere;
      background: var(--text);
      background: linear-gradient(180deg, var(--text) 30%, color-mix(in srgb, var(--text) 62%, var(--gold)) 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }
    .hero-role { margin-top: 16px; font-size: 1.08rem; color: var(--text-2); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
    .hero-role strong { color: var(--text); font-weight: 600; }
    .hero-role .sep { width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); }
    .domain-row { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
    .domain-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      color: var(--gold-text);
      font-size: 0.8rem; font-weight: 700;
    }
    .hero-actions { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
    .owner-tip {
      margin-top: 16px;
      max-width: 560px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--gold-dim);
      border: 1px dashed var(--gold-line);
      font-size: 0.82rem;
      color: var(--text-2);
    }
    .owner-tip strong { color: var(--gold-text); }

    /* Credential card (the collectible) */
    .cred-stage { perspective: 1100px; }
    .cred-card {
      position: relative;
      overflow: hidden;
      padding: 26px 26px 22px;
      border-radius: 24px;
      background: var(--cred-bg);
      border: 1px solid var(--gold-line);
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.03) inset;
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transform-style: preserve-3d;
      transition: transform 0.5s var(--ease);
    }
    .cred-card.is-tilting { transition: transform 0.08s linear; }
    .cred-card::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at var(--mx, 70%) var(--my, 0%), var(--sheen), transparent 45%);
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .cred-card::after {
      content: '';
      position: absolute; inset: -40% -60%;
      background: linear-gradient(115deg, transparent 40%, var(--sheen) 50%, transparent 60%);
      transform: translateX(-60%);
      animation: sheen 6s ease-in-out 1.2s infinite;
      pointer-events: none;
    }
    @keyframes sheen { 0%, 70% { transform: translateX(-60%); } 100% { transform: translateX(60%); } }
    .cred-top { position: relative; display: flex; align-items: center; justify-content: space-between; }
    .cred-brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; }
    .cred-brand img { width: 28px; height: 28px; border-radius: 50%; }
    .cred-type { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-text); }
    .cred-main { position: relative; display: flex; align-items: center; gap: 18px; margin: 26px 0 22px; }
    .seal-ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
    .seal-ring svg { transform: rotate(-90deg); }
    .seal-ring .track { stroke: var(--line-strong); }
    .seal-ring .bar { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 1.6s var(--ease) 0.35s; }
    .seal-center { position: absolute; inset: 0; display: grid; place-items: center; }
    .seal-value { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
    .seal-value span { font-size: 0.9rem; color: var(--text-3); font-weight: 700; }
    .cred-claim { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
    .cred-claim-sub { margin-top: 4px; font-size: 0.82rem; color: var(--text-2); }
    .cred-rows { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; padding-top: 18px; border-top: 1px dashed var(--gold-line); }
    .cred-row dt { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
    .cred-row dd { margin-top: 2px; font-size: 0.86rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .cred-row dd.mono { font-family: var(--font-mono); font-size: 0.8rem; }
    .cred-stamp {
      position: absolute; right: 18px; bottom: 16px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--sage-dim);
      border: 1px solid var(--sage-line);
      color: var(--sage-text);
      font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* ═══ Highlights ═══ */
    .highlights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: -32px; position: relative; z-index: 2; }
    .highlight {
      padding: 20px 22px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: transform 0.3s var(--ease), border-color 0.3s;
    }
    .highlight:hover { transform: translateY(-3px); border-color: var(--gold-line); }
    .highlight-value { font-family: var(--font-display); font-size: 2.3rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
    .highlight-value small { font-size: 1rem; font-weight: 700; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }
    .highlight-label { margin-top: 8px; font-size: 0.84rem; font-weight: 600; color: var(--text-2); }

    /* ═══ Proof of Work ═══ */
    .milestones { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; list-style: none; }
    .milestone {
      position: relative;
      overflow: hidden;
      display: flex; flex-direction: column;
      min-height: 220px;
      padding: 24px;
      border-radius: var(--radius-lg);
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: transform 0.35s var(--ease), border-color 0.3s, box-shadow 0.35s;
    }
    .milestone:hover { transform: translateY(-4px); border-color: var(--gold-line); box-shadow: var(--shadow-lg); }
    .milestone::before {
      content: '';
      position: absolute; right: -80px; top: -80px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-dim), transparent 70%);
      opacity: 0; transition: opacity 0.35s;
      pointer-events: none;
    }
    .milestone:hover::before { opacity: 1; }
    .milestone-num {
      position: absolute; right: 18px; top: 4px;
      font-family: var(--font-display); font-size: 6.5rem; font-weight: 800; letter-spacing: -0.06em; line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--line-strong);
      pointer-events: none;
      user-select: none;
    }
    .milestone-top { position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge-approved {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--sage-dim);
      border: 1px solid var(--sage-line);
      color: var(--sage-text);
      font-weight: 700; font-size: 0.72rem;
    }
    .milestone-domain {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--card-2);
      border: 1px solid var(--line);
      font-size: 0.72rem; font-weight: 600; color: var(--text-2);
    }
    .milestone-week { position: relative; margin-top: 22px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-text); }
    .milestone-title { position: relative; margin-top: 4px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; letter-spacing: -0.025em; }
    .milestone-date { position: relative; margin-top: 4px; font-size: 0.84rem; color: var(--text-2); }
    .milestone-actions { position: relative; margin-top: auto; padding-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      color: var(--text-2);
      font-size: 0.9rem;
    }
    .empty-state strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 4px; }

    /* ═══ Skills + trust ═══ */
    .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    .panel {
      padding: 26px;
      border-radius: var(--radius-lg);
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .panel-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }
    .panel-sub { margin-top: 4px; font-size: 0.86rem; color: var(--text-2); }
    .skills-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .skill-pill {
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--card-2);
      border: 1px solid var(--line-strong);
      font-size: 0.85rem; font-weight: 600;
      transition: border-color 0.2s, color 0.2s, transform 0.2s var(--ease);
    }
    .skill-pill:hover { border-color: var(--gold-line); color: var(--gold-text); transform: translateY(-1px); }

    .trust-list { list-style: none; margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
    .trust-list li { display: flex; gap: 12px; align-items: flex-start; }
    .trust-ico {
      width: 32px; height: 32px; flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: 9px;
      background: var(--sage-dim);
      color: var(--sage-text);
    }
    .trust-list strong { display: block; font-size: 0.9rem; font-weight: 700; }
    .trust-list span { font-size: 0.82rem; color: var(--text-2); }
    .trust-actions { margin-top: 20px; }

    /* ═══ Closing CTA ═══ */
    .cta-band {
      position: relative; overflow: hidden; isolation: isolate;
      margin-top: 56px;
      padding: 40px;
      border-radius: 28px;
      border: 1px solid var(--gold-line);
      background: var(--card);
      display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    }
    .cta-band::before {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse 50% 120% at 0% 100%, var(--aurora-1), transparent 70%),
        radial-gradient(ellipse 40% 100% at 100% 0%, var(--aurora-2), transparent 70%);
      opacity: 0.8;
    }
    .cta-title { font-family: var(--font-display); font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; max-width: 560px; }
    .cta-sub { margin-top: 8px; font-size: 0.92rem; color: var(--text-2); max-width: 520px; }
    .cta-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .page-footer {
      margin-top: 56px;
      padding: 24px 0 40px;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      font-size: 0.8rem; color: var(--text-3);
    }
    .page-footer a { color: var(--text-2); text-decoration: none; }
    .page-footer a:hover { color: var(--gold-text); }

    /* ═══ Post preview modal ═══ */
    .post-modal {
      position: fixed; inset: 0; z-index: 200;
      display: none; align-items: center; justify-content: center;
      padding: 16px;
      background: rgba(5, 5, 6, 0.6);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: 0; transition: opacity 0.25s ease;
    }
    .post-modal.open { display: flex; }
    .post-modal.show { opacity: 1; }
    .post-dialog {
      width: 100%; max-width: 560px;
      max-height: calc(100vh - 32px);
      display: flex; flex-direction: column;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform: translateY(12px) scale(0.98);
      transition: transform 0.35s var(--ease);
    }
    .post-modal.show .post-dialog { transform: none; }
    .post-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--line); }
    .post-head strong { font-family: var(--font-display); font-size: 1.05rem; }
    .post-frame-wrap { position: relative; flex: 1; min-height: 420px; background: #fff; }
    .post-frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .post-loading { position: absolute; inset: 0; display: grid; place-items: center; color: #777; font-size: 0.86rem; }
    .post-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 12px 20px; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--text-3); }

    /* ═══ Toast ═══ */
    .portfolio-toast {
      position: fixed; bottom: 24px; left: 50%; z-index: 300;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--text);
      color: var(--bg);
      font-size: 0.86rem; font-weight: 600;
      box-shadow: var(--shadow-lg);
      transform: translate(-50%, 120px);
      opacity: 0;
      transition: transform 0.35s var(--ease), opacity 0.35s var(--ease);
    }
    .portfolio-toast svg { color: var(--sage); }
    .portfolio-toast.show { transform: translate(-50%, 0); opacity: 1; }

    /* ═══ Loading skeleton ═══ */
    .skeleton {
      background: linear-gradient(90deg, var(--card) 25%, var(--card-2) 50%, var(--card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-lg);
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skeleton-hero { display: grid; grid-template-columns: 1fr 380px; gap: 48px; padding: 72px 0 64px; }

    /* ═══ Locked / error states ═══ */
    .locked-card {
      padding: 56px 28px;
      text-align: center;
      max-width: 560px;
      margin: 72px auto;
      border-radius: var(--radius-lg);
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      animation: fadeUp 0.5s var(--ease) both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .locked-icon-wrap {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      display: grid; place-items: center;
      border-radius: 18px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      color: var(--gold-text);
    }
    .locked-title { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
    .locked-desc { font-size: 0.94rem; color: var(--text-2); line-height: 1.65; margin-bottom: 26px; }
    .locked-desc code { font-family: var(--font-mono); font-size: 0.8rem; color: var(--gold-text); background: var(--gold-dim); padding: 2px 6px; border-radius: 6px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal { opacity: 1; transform: none; }
    }

    /* ═══ Responsive ═══ */
    @media (max-width: 960px) {
      .hero-grid, .skeleton-hero { grid-template-columns: 1fr; gap: 36px; }
      .cred-stage { max-width: 440px; }
      .highlights { grid-template-columns: repeat(2, 1fr); margin-top: 28px; }
      .split { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .nav-divider, .nav-context, .nav-copy-label { display: none; }
      .nav-container, .wrap { padding-left: 16px; padding-right: 16px; }
      .profile-hero-card { padding: 40px 0 36px; }
      .avatar { width: 88px; height: 88px; }
      .avatar-monogram { font-size: 1.7rem; }
      .hero-role { flex-direction: column; align-items: flex-start; gap: 2px; font-size: 1rem; }
      .hero-role .sep { display: none; }
      .hero-actions .btn { flex: 1 1 auto; }
      .cred-card { padding: 22px 20px 20px; }
      .highlights { gap: 10px; margin-top: 24px; }
      .highlight { padding: 16px; }
      .highlight-value { font-size: 1.8rem; }
      .section { padding-top: 44px; }
      .milestones { grid-template-columns: 1fr; }
      .milestone { min-height: 0; padding: 20px; }
      .milestone-num { font-size: 5rem; }
      .panel { padding: 20px; }
      .cta-band { padding: 26px 22px; }
      .cta-actions, .cta-actions .btn { width: 100%; }
      .page-footer { flex-direction: column; text-align: center; }
    }

    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      html, body { background: #fff !important; color: #111 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .navbar, .portfolio-toast, .hero-actions, .owner-tip, .trust-actions, .cta-band, .milestone-actions, .aurora, .post-modal { display: none !important; }
      .profile-hero-card { padding: 0 0 20px; border: 0; }
      .hero-grid { grid-template-columns: 1fr 300px; gap: 24px; }
      .hero-name { background: none; color: #111 !important; -webkit-text-fill-color: #111; font-size: 2.4rem; }
      .cred-card, .highlight, .milestone, .panel { background: #fff !important; border: 1px solid #ddd !important; box-shadow: none !important; transform: none !important; break-inside: avoid; }
      .cred-card::before, .cred-card::after, .milestone::before { display: none; }
      .highlights { margin-top: 16px; grid-template-columns: repeat(4, 1fr); }
      .milestones { grid-template-columns: 1fr 1fr; }
      .milestone { min-height: 0; }
      .split { grid-template-columns: 1fr 1fr; }
      .reveal { opacity: 1 !important; transform: none !important; }
      .section { padding-top: 24px; }
      .hero-role, .highlight-label, .milestone-date, .panel-sub, .trust-list span, .page-footer, .section-sub { color: #444 !important; }
    }
    .skip-link { position: absolute; left: 12px; top: -48px; z-index: 1001; padding: 10px 14px; border-radius: 8px; background: var(--text, #0a0a0a); color: var(--bg, #fff); font-weight: 600; text-decoration: none; }
    .skip-link:focus { top: 12px; }
  </style>
</head>

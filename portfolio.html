<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proof of Work Portfolio — SkillMe</title>
  <meta name="description" content="Verified Open Source Contributions via SkillMe">
  <link rel="icon" href="assets/logo.webp" type="image/png">
  
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="skillme-monitor.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <style>
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .portfolio-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 100px 24px 60px;
      width: 100%;
      flex: 1;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid rgba(245, 158, 11, 0.2);
      margin: 0 auto 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(245, 158, 11, 0.1);
    }
    
    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: var(--text-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    [data-theme="light"] .profile-name {
      -webkit-text-fill-color: initial;
      color: var(--text-primary);
    }

    .profile-title {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    
    .profile-title span {
      color: var(--accent-indigo);
      font-weight: 500;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    [data-theme="light"] .stat-card {
      border-color: rgba(0, 0, 0, 0.06);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(245, 158, 11, 0.2);
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }
    
    [data-theme="light"] .section-title {
      border-bottom-color: rgba(0, 0, 0, 0.1);
    }

    .pr-feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pr-card {
      display: flex;
      align-items: center;
      padding: 20px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    [data-theme="light"] .pr-card {
      border-color: rgba(0, 0, 0, 0.06);
    }

    .pr-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(52, 211, 153, 0.3);
      transform: translateX(4px);
    }
    
    [data-theme="light"] .pr-card:hover {
      border-color: rgba(52, 211, 153, 0.6);
    }

    .pr-icon {
      font-size: 1.5rem;
      margin-right: 16px;
      color: var(--accent-emerald);
    }

    .pr-content {
      flex: 1;
    }

    .pr-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .pr-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .pr-badge {
      padding: 2px 8px;
      background: rgba(52, 211, 153, 0.1);
      color: var(--accent-emerald);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .pr-domain {
      padding: 2px 8px;
      background: rgba(245, 158, 11, 0.1);
      color: var(--accent-indigo);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .locked-state {
      text-align: center;
      padding: 64px 24px;
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      margin-top: 60px;
    }
    [data-theme="light"] .locked-state {
      border-color: rgba(0, 0, 0, 0.2);
    }
    
    .locked-icon {
      font-size: 3rem;
      margin-bottom: 24px;
      opacity: 0.5;
    }
    
    .locked-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    
    .locked-text {
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto 24px;
      line-height: 1.6;
    }

  </style>
  <style>.brand-logo-img, .logo img, .nav-logo img, .cert-company-logo, .lh-logo { width: 36px !important; height: 36px !important; max-width: 36px !important; max-height: 36px !important; object-fit: cover !important; border-radius: 50% !important; flex-shrink: 0 !important; }</style>
</head>
<body>

  <!-- Dynamic Theme Backgrounds (matching dashboard) -->
  <div class="dot-grid"></div>
  <div class="aurora-blob" style="top: -10%; left: -10%; background: var(--accent-indigo);"></div>
  <div class="aurora-blob" style="bottom: -10%; right: -10%; background: var(--accent-emerald);"></div>

    <nav class="navbar scrolled" id="navbar">
    <div class="container">
    <div class="nav-left">
      <a href="index.html" class="nav-logo" id="nav-logo">
        <img src="assets/logo.webp" alt="SkillMe Logo" class="brand-logo-img" width="36" height="36" style="width: 36px !important; height: 36px !important; max-width: 36px !important; max-height: 36px !important; object-fit: cover !important; border-radius: 50% !important;">
        <span>SkillMe</span>
      </a>
    </div>
    <div class="nav-links-center" id="nav-links-center">
      <a href="index.html#how-it-works">How It Works</a>
      <a href="index.html#domains">Domains</a>
      <a href="index.html#benefits">Benefits</a>
      <a href="index.html#faq">FAQ</a>
    </div>
    <div class="nav-actions-right">
      <a href="dashboard.html" class="nav-link-dashboard" id="nav-dashboard-btn">Student Dashboard &rarr;</a>
      <a href="quiz.html" class="nav-cta" id="nav-apply-btn">Apply Now &rarr;</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
  </nav>

  <div class="portfolio-container" id="content-container">
    <!-- Loading State -->
    <div style="text-align: center; margin-top: 100px; color: var(--text-secondary);" id="loading-state">
      <div class="spinner" style="margin: 0 auto 20px;"></div>
      <p>Loading Portfolio...</p>
    </div>
  </div>

  <script src="portfolio.js"></script>
<script>
  // Mobile nav toggle
  (function() {
    var t = document.getElementById('nav-toggle');
    var n = document.getElementById('nav-links-center');
    if (!t || !n) return;
    t.addEventListener('click', function() {
      var o = n.classList.toggle('open');
      t.classList.toggle('active', o);
      document.body.style.overflow = o ? 'hidden' : '';
    });
    n.querySelectorAll('a').forEach(function(l) {
      l.addEventListener('click', function() {
        n.classList.remove('open'); t.classList.remove('active');
        document.body.style.overflow = '';
      });
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && n.classList.contains('open')) {
        n.classList.remove('open'); t.classList.remove('active');
        document.body.style.overflow = '';
      }
    });
  })();
</script></body>
</html>

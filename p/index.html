<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Student portfolio — SkillMe</title>
  <script>
    // Served when /p/ is opened without a username. /p/:username itself is rewritten
    // to portfolio.html by vercel.json; this only catches the bare folder.
    const parts = window.location.pathname.split('/').filter(Boolean); // ['p', 'username']
    const username = parts[1];
    window.location.replace(username ? '/portfolio?gh=' + encodeURIComponent(username) : '/');
  </script>
</head>
<body>
  <p><a href="/">Go to SkillMe</a></p>
</body>
</html>

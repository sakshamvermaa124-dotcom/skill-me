<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="sealNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Outer Starburst / Circular Border -->
  <circle cx="50" cy="50" r="48" fill="url(#sealNavy)" stroke="url(#sealGold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#FEF08A" stroke-width="0.8" stroke-dasharray="2,2"/>
  <circle cx="50" cy="50" r="39" fill="#0C0B0B" stroke="url(#sealGold)" stroke-width="1"/>

  <!-- Tricolor Arcs -->
  <path d="M 22 50 A 28 28 0 0 1 78 50" fill="none" stroke="#FF9933" stroke-width="2" stroke-linecap="round"/>
  <path d="M 24 56 A 26 26 0 0 0 76 56" fill="none" stroke="#138808" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Emblem Text -->
  <text x="50" y="38" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MSME</text>
  <text x="50" y="49" font-family="'Inter', sans-serif" font-weight="800" font-size="6" fill="#FBBF24" text-anchor="middle" letter-spacing="0.8">UDYAM</text>
  <text x="50" y="58" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="5" fill="#93C5FD" text-anchor="middle">UP-50-0294192</text>
  <text x="50" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="4.5" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">GOVT OF INDIA</text>

  <!-- Stars -->
  <text x="18" y="52" font-size="7" fill="#F59E0B" text-anchor="middle">★</text>
  <text x="82" y="52" font-size="7" fill="#F59E0B" text-anchor="middle">★</text>
</svg>

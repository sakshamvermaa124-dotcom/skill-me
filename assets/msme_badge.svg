<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0E6205" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="236" height="66" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow)"/>
  
  <!-- Left Side Emblem Container -->
  <g transform="translate(10, 7)">
    <!-- Circular Shield Background -->
    <circle cx="28" cy="28" r="26" fill="url(#navyGrad)" stroke="#C99A4E" stroke-width="1.2"/>
    
    <!-- Tricolor Arc Ribbons -->
    <path d="M 10 28 A 18 18 0 0 1 46 28" fill="none" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 12 33 A 16 16 0 0 0 44 33" fill="none" stroke="#138808" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Central MSME Typography -->
    <text x="28" y="26" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">MSME</text>
    <text x="28" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="6.5" fill="#FBBF24" text-anchor="middle" letter-spacing="0.8">GOVT OF INDIA</text>
    
    <!-- Decorative Stars -->
    <polygon points="17,14 18,16 20,16 18.5,17.2 19,19.2 17,18 15,19.2 15.5,17.2 14,16 16,16" fill="#F59E0B"/>
    <polygon points="39,14 40,16 42,16 40.5,17.2 41,19.2 39,18 37,19.2 37.5,17.2 36,16 38,16" fill="#F59E0B"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="72" y1="12" x2="72" y2="58" stroke="#E2E8F0" stroke-width="1" />

  <!-- Right Side Official Text -->
  <g transform="translate(80, 0)">
    <!-- Top Micro Tag -->
    <rect x="0" y="10" width="102" height="13" rx="3" fill="rgba(245, 158, 11, 0.12)" />
    <text x="51" y="19" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="7" fill="#B45309" text-anchor="middle" letter-spacing="0.6">UDYAM REGISTERED</text>
    
    <!-- Ministry Title -->
    <text x="0" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" fill="#0F172A" letter-spacing="-0.1">Ministry of MSME</text>
    <text x="0" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="7.5" fill="#64748B">Government of India</text>
    
    <!-- Registration Number -->
    <text x="0" y="57" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="700" font-size="8.5" fill="#2563EB" letter-spacing="0.2">UDYAM-UP-50-0294192</text>
  </g>
</svg>

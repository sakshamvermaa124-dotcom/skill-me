<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — SkillMe</title>
  <meta name="description" content="Contact SkillMe for support and inquiries">
  <link rel="icon" href="assets/logo.webp" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    .legal-page { padding: 140px 24px 80px; max-width: 800px; margin: 0 auto; min-height: calc(100vh - 300px); color: var(--text-secondary); line-height: 1.7; }
    .legal-page h1 { color: var(--text); font-size: 2.5rem; margin-bottom: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .legal-page h2 { color: var(--text); font-size: 1.5rem; margin-top: 40px; margin-bottom: 16px; font-weight: 700; }
    .legal-page p { margin-bottom: 16px; }
    
    .contact-card {
      background: var(--bg-card);
      border: var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-top: 32px;
    }
    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }
    .contact-item:last-child { margin-bottom: 0; }
    .contact-icon {
      background: rgba(99, 102, 241, 0.1);
      color: var(--accent-indigo);
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .contact-label {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      display: block;
    }
    .contact-value {
      color: var(--text-secondary);
    }
  </style>
  <style>.brand-logo-img, .logo img, .nav-logo img, .cert-company-logo, .lh-logo { width: 36px !important; height: 36px !important; max-width: 36px !important; max-height: 36px !important; object-fit: cover !important; border-radius: 50% !important; flex-shrink: 0 !important; }</style>
</head>
<body style="background: var(--bg-primary);">
  <!-- Navbar -->
  <nav class="navbar scrolled" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo" id="nav-logo">
        <img width="36" height="36" src="assets/logo.webp" alt="SkillMe Logo" style="width: 36px !important; height: 36px !important; max-width: 36px !important; max-height: 36px !important; object-fit: cover !important; border-radius: 50% !important;">
        <span>SkillMe</span>
      </a>
      <div class="nav-links" id="nav-links">
        <a href="index.html#how-it-works">How It Works</a>
        <a href="index.html#domains">Domains</a>
        <a href="index.html#faq">FAQ</a>
        <a href="dashboard.html">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="legal-page">
    <h1>Contact Us</h1>
    <p>If you have any questions, concerns, or need assistance, our support team is here to help.</p>

    <div class="contact-card">
      <div class="contact-item">
        <div class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </div>
        <div>
          <span class="contact-label">Business Name</span>
          <span class="contact-value">SkillMe</span>
        </div>
      </div>

      <div class="contact-item">
        <div class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <div>
          <span class="contact-label">Email Support</span>
          <span class="contact-value"><a href="mailto:sakshamverma124@gmail.com" style="color: var(--accent-blue); text-decoration: none;">sakshamverma124@gmail.com</a></span>
        </div>
      </div>

      <div class="contact-item">
        <div class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div>
          <span class="contact-label">Registered Address</span>
          <span class="contact-value">Kalyanpur, Lucknow</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer" style="margin-top: auto; padding-top: 20px; padding-bottom: 20px;">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0; margin-top: 0;">
        <p>© 2026 SkillMe. All rights reserved.</p>
      </div>
    </div>
  </footer>
</body>
</html>
